name: Build CircuitPython + LVGL

on:
  workflow_dispatch:
    inputs:
      cp_ref:
        description: "CircuitPython tag 或分支"
        required: true
        default: "11.0.0-alpha.2"
      board:
        description: "CircuitPython 板子名称"
        required: true
        default: "sunton_esp32_8048S050"
      extra_make_args:
        description: "额外 make 参数（默认留空）"
        required: false
        default: ""
      diag_only:
        description: "只打补丁并检查，不编译"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]

env:
  CP_REF: ${{ github.event.inputs.cp_ref || '11.0.0-alpha.2' }}
  BOARD: ${{ github.event.inputs.board || 'sunton_esp32_8048S050' }}
  EXTRA_MAKE_ARGS: ${{ github.event.inputs.extra_make_args || '' }}
  DIAG_ONLY: ${{ github.event.inputs.diag_only || 'false' }}
  IDF_TOOLS_PATH: ${{ github.workspace }}/.idf_tools
  # build.log 确认实际加载的 flash 配置
  FLASH_DEFAULTS: esp-idf-config/sdkconfig-flash-16MB-no-uf2.defaults
  PART_CSV: esp-idf-config/partitions-16MB-no-uf2.csv

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext cmake ninja-build ccache libusb-1.0-0

      - name: Clone CircuitPython
        run: |
          echo "Cloning CircuitPython ref: $CP_REF"
          git clone --depth 1 --branch "$CP_REF" https://github.com/adafruit/circuitpython.git circuitpython
          git -C circuitpython log -1 --format='%h %cd %s' --date=short

      - name: Clone omnipython-lvgl
        run: |
          git clone --recurse-submodules --shallow-submodules \
            https://github.com/PyDevices/omnipython-lvgl.git omnipython-lvgl
          git -C omnipython-lvgl log -1 --oneline

      # ===== 第 4 步（已验证）：qstr 偏移 16 位 -> 32 位 =====
      - name: "Patch 1: 32-bit qstr offsets"
        run: |
          set -e
          cd circuitpython
          n=$(grep -c "^QSTR_BLOB_MAX = 1 << 16" py/makeqstrdata.py || true)
          if [ "$n" != "1" ]; then
            echo "::error::makeqstrdata.py 中未唯一匹配 'QSTR_BLOB_MAX = 1 << 16'（匹配 $n 次）"; exit 1
          fi
          sed -i 's/^QSTR_BLOB_MAX = 1 << 16/QSTR_BLOB_MAX = 1 << 32/' py/makeqstrdata.py

          n=$(grep -cE "typedef[[:space:]]+uint16_t[[:space:]]+qstr_offset_t" py/qstr.h || true)
          if [ "$n" != "1" ]; then
            echo "::error::py/qstr.h 中未唯一匹配 'typedef uint16_t qstr_offset_t'（匹配 $n 次）"; exit 1
          fi
          sed -i -E "s/typedef([[:space:]]+)uint16_t([[:space:]]+)qstr_offset_t/typedef\1uint32_t\2qstr_offset_t/" py/qstr.h

          grep -n "QSTR_BLOB_MAX" py/makeqstrdata.py
          grep -n "qstr_offset_t" py/qstr.h

      # ===== 第 5 步（已验证）：重写分区表，app 分区 2048K -> 4096K =====
      - name: "Patch 2: enlarge app partitions"
        run
