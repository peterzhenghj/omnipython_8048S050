name: Build CircuitPython + LVGL

on:
  workflow_dispatch:
    inputs:
      cp_ref:
        description: "CircuitPython tag 或分支"
        required: true
        default: "11.0.0-alpha.2"
      board:
        description: "CircuitPython 板子名称"
        required: true
        default: "sunton_esp32_8048S050"
      extra_make_args:
        description: "额外 make 参数（默认留空）"
        required: false
        default: ""
      diag_only:
        description: "只打补丁并检查，不编译"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]

env:
  CP_REF: ${{ github.event.inputs.cp_ref || '11.0.0-alpha.2' }}
  BOARD: ${{ github.event.inputs.board || 'sunton_esp32_8048S050' }}
  EXTRA_MAKE_ARGS: ${{ github.event.inputs.extra_make_args || '' }}
  DIAG_ONLY: ${{ github.event.inputs.diag_only || 'false' }}
  IDF_TOOLS_PATH: ${{ github.workspace }}/.idf_tools
  # build.log 确认实际加载的 flash 配置
  FLASH_DEFAULTS: esp-idf-config/sdkconfig-flash-16MB-no-uf2.defaults

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext cmake ninja-build ccache libusb-1.0-0

      - name: Clone CircuitPython
        run: |
          echo "Cloning CircuitPython ref: $CP_REF"
          git clone --depth 1 --branch "$CP_REF" https://github.com/adafruit/circuitpython.git circuitpython
          git -C circuitpython log -1 --format='%h %cd %s' --date=short

      - name: Clone omnipython-lvgl
        run: |
          git clone --recurse-submodules --shallow-submodules \
            https://github.com/PyDevices/omnipython-lvgl.git omnipython-lvgl
          git -C omnipython-lvgl log -1 --oneline

      # ===== 第 4 步（已验证）：qstr 偏移 16 位 -> 32 位 =====
      - name: "Patch 1: 32-bit qstr offsets"
        run: |
          set -e
          cd circuitpython
          n=$(grep -c "^QSTR_BLOB_MAX = 1 << 16" py/makeqstrdata.py || true)
          if [ "$n" != "1" ]; then
            echo "::error::makeqstrdata.py 中未唯一匹配 'QSTR_BLOB_MAX = 1 << 16'（匹配 $n 次）"; exit 1
          fi
          sed -i 's/^QSTR_BLOB_MAX = 1 << 16/QSTR_BLOB_MAX = 1 << 32/' py/makeqstrdata.py

          n=$(grep -cE "typedef[[:space:]]+uint16_t[[:space:]]+qstr_offset_t" py/qstr.h || true)
          if [ "$n" != "1" ]; then
            echo "::error::py/qstr.h 中未唯一匹配 'typedef uint16_t qstr_offset_t'（匹配 $n 次）"; exit 1
          fi
          sed -i -E "s/typedef([[:space:]]+)uint16_t([[:space:]]+)qstr_offset_t/typedef\1uint32_t\2qstr_offset_t/" py/qstr.h

          grep -n "QSTR_BLOB_MAX" py/makeqstrdata.py
          grep -n "qstr_offset_t" py/qstr.h

      # ===== 第 5 步：重写分区表，app 分区 2048K -> 4096K =====
      - name: "Patch 2: enlarge app partitions"
        run: |
          set -e
          cd circuitpython/ports/espressif
          LOG="$GITHUB_WORKSPACE/partition.log"

          # 1) 找到实际使用的分区表 CSV（板子 sdkconfig 可覆盖默认值，取最后一个）
          [ -f "$FLASH_DEFAULTS" ] || { echo "::error::$FLASH_DEFAULTS 不存在"; ls esp-idf-config/ | tee "$LOG"; exit 1; }
          CSV=$(grep -h "^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME" "$FLASH_DEFAULTS" "boards/$BOARD/sdkconfig" 2>/dev/null \
                | tail -1 | cut -d= -f2 | tr -d '"')
          {
            echo "FLASH_DEFAULTS=$FLASH_DEFAULTS"
            echo "CSV(from sdkconfig)=$CSV"
          } | tee "$LOG"
          [ -n "$CSV" ] || { echo "::error::未找到 CONFIG_PARTITION_TABLE_CUSTOM_FILENAME"; cat "$FLASH_DEFAULTS" | tee -a "$LOG"; exit 1; }
          [ -f "$CSV" ] || { echo "::error::分区表文件 $CSV 不存在（路径相对 ports/espressif）"; exit 1; }

          echo -e "\n########## 原始 $CSV ##########" | tee -a "$LOG"
          cat "$CSV" | tee -a "$LOG"

          # 2) 校验原表布局：去注释/空白，大小统一换算为 K（2M == 2048K）
          norm() {
            grep -v '^[[:space:]]*#' "$1" | grep -v '^[[:space:]]*$' | tr -d ' \t' | sed 's/,$//' \
            | awk -F, 'BEGIN{OFS=","} {
                s=$5
                if (s ~ /^[0-9]+[Mm]$/)      { sub(/[Mm]$/,"",s); s=(s*1024) "K" }
                else if (s ~ /^[0-9]+[Kk]$/) { sub(/[Kk]$/,"",s); s=s "K" }
                $5=s; print $1,$2,$3,$4,$5 }'
          }
          EXPECT=$(printf '%s\n' \
            "nvs,data,nvs,0x9000,20K" \
            "otadata,data,ota,0xe000,8K" \
            "ota_0,app,ota_0,0x10000,2048K" \
            "ota_1,app,ota_1,0x210000,2048K" \
            "user_fs,data,fat,0x410000,12224K")
          ACTUAL=$(norm "$CSV")
          if [ "$ACTUAL" != "$EXPECT" ]; then
            echo "::error::$CSV 布局与预期不一致，未修改。请把 partition.log 发出来。"
            echo -e "\n预期：\n$EXPECT\n实际（规范化后）：\n$ACTUAL" | tee -a "$LOG"
            exit 1
          fi
          echo -e "\n>> 原表布局校验通过" | tee -a "$LOG"

          # 3) 写入新分区表（偏移已重新计算，0x810000 + 8128K = 16MB）
          cat > "$CSV" <<'EOF'
          # Name,             Type,   SubType,    Offset,     Size
          # bootloader,       app,    boot,       0x1000/0x0, 28/32K
          # partition_table,  data,   table,      0x8000,     4K
          nvs,                data,   nvs,        0x9000,     20K
          otadata,            data,   ota,        0xe000,     8K
          ota_0,              app,    ota_0,      0x10000,    4096K
          ota_1,              app,    ota_1,      0x410000,   4096K
          user_fs,            data,   fat,        0x810000,   8128K
          EOF
          sed -i 's/^[[:space:]]\{10\}//' "$CSV"

          echo -e "\n########## 修改后 $CSV ##########" | tee -a "$LOG"
          cat "$CSV" | tee -a "$LOG"

          # 4) 用 ESP-IDF 自带工具离线校验（重叠/越界/对齐错误会直接失败）
          echo -e "\n########## gen_esp32part 校验 ##########" | tee -a "$LOG"
          set -o pipefail
          python3 esp-idf/components/partition_table/gen_esp32part.py \
            --flash-size 16MB "$CSV" "$RUNNER_TEMP/pt.bin" 2>&1 | tee -a "$LOG"
          python3 esp-idf/components/partition_table/gen_esp32part.py \
            "$RUNNER_TEMP/pt.bin" 2>&1 | tee -a "$LOG"

      - name: Upload patch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-logs
          path: partition.log
          if-no-files-found: ignore

      # ===== 编译 =====
      - name: Fetch port submodules
        if: env.DIAG_ONLY != 'true'
        run: |
          cd circuitpython/ports/espressif
          make fetch-port-submodules

      - name: Install ESP-IDF
        if: env.DIAG_ONLY != 'true'
        run: |
          cd circuitpython/ports/espressif
          ./esp-idf/install.sh esp32s3

      - name: Install Python requirements
        if: env.DIAG_ONLY != 'true'
        run: |
          source circuitpython/ports/espressif/esp-idf/export.sh
          pip install -r circuitpython/requirements-dev.txt

      - name: Build mpy-cross
        if: env.DIAG_ONLY != 'true'
        run: make -C circuitpython/mpy-cross -j"$(nproc)"

      - name: Build firmware
        if: env.DIAG_ONLY != 'true'
        run: |
          set -o pipefail
          source circuitpython/ports/espressif/esp-idf/export.sh
          make -C circuitpython/ports/espressif BOARD="$BOARD" \
            USER_C_MODULES="$GITHUB_WORKSPACE/omnipython-lvgl/ports/circuitpython" \
            CIRCUITPY_GIFIO=0 \
            $EXTRA_MAKE_ARGS \
            V=1 -j"$(nproc)" 2>&1 | tee build.log

      - name: "Diag: build summary"
        if: always() && env.DIAG_ONLY != 'true'
        continue-on-error: true
        run: |
          echo "== 实际生成的分区表 =="
          grep -A9 "Partition table binary generated" build.log || echo "未找到"
          echo "== flash 使用 =="
          grep -n -E "bytes used.*flash firmware space|Too little flash" build.log || true
          echo "== 编译错误 =="
          grep -n -E "error:|Error [0-9]" build.log | head -30 || echo "无"
          echo "== 输出文件 =="
          ls -la circuitpython/ports/espressif/build-$BOARD/firmware.* 2>/dev/null || true

      - name: Upload build log
        if: always() && env.DIAG_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload firmware
        if: success() && env.DIAG_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.BOARD }}
          path: |
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.bin
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.elf
          if-no-files-found: warn
