name: Build CircuitPython + LVGL

on:
  workflow_dispatch:
    inputs:
      cp_ref:
        description: "CircuitPython tag 或分支"
        required: true
        default: "11.0.0-alpha.2"
      board:
        description: "CircuitPython 板子名称"
        required: true
        default: "sunton_esp32_8048S050"
  push:
    branches: [main]

env:
  CP_REF: ${{ github.event.inputs.cp_ref || '11.0.0' }}
  BOARD: ${{ github.event.inputs.board || 'sunton_esp32_8048S050' }}
  IDF_TOOLS_PATH: ${{ github.workspace }}/.idf_tools

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext cmake ninja-build ccache libusb-1.0-0

      - name: Clone CircuitPython
        run: |
          git clone --depth 1 --branch "$CP_REF" https://github.com/adafruit/circuitpython.git circuitpython
          cd circuitpython/ports/espressif
          make fetch-port-submodules

      - name: Clone omnipython-lvgl
        run: |
          git clone --recurse-submodules --shallow-submodules \
            https://github.com/PyDevices/omnipython-lvgl.git omnipython-lvgl

      # ===== 第 1 步：排查信息（不会让 job 失败）=====
      - name: "Diag 1: versions"
        continue-on-error: true
        run: |
          echo "CP_REF=$CP_REF  BOARD=$BOARD"
          echo "== CircuitPython commit =="; git -C circuitpython log -1 --oneline
          echo "== omnipython-lvgl commit =="; git -C omnipython-lvgl log -1 --oneline
          echo "== 板子目录是否存在 =="; ls circuitpython/ports/espressif/boards/ | grep -i 8048 || echo "未找到 8048 相关板子"

      - name: "Diag 2: QSTR_OFFSET_BYTES support"
        continue-on-error: true
        run: |
          echo "== circuitpython/py =="
          grep -rn "QSTR_OFFSET_BYTES" circuitpython/py || echo ">> py 中未找到"
          echo "== circuitpython/ports/espressif =="
          grep -rn "QSTR_OFFSET_BYTES" circuitpython/ports/espressif --include=*.h --include=*.mk --include=Makefile || echo ">> espressif 中未找到"
          echo "== omnipython-lvgl/ports/circuitpython =="
          grep -rn "QSTR_OFFSET_BYTES" omnipython-lvgl/ports/circuitpython || echo ">> 模块中未找到"
          echo "== micropython.mk 全文 =="
          cat omnipython-lvgl/ports/circuitpython/micropython.mk || true

      - name: "Diag 3: qstr size limit in makeqstrdata.py"
        continue-on-error: true
        run: |
          grep -n -B3 -A3 "too large" circuitpython/py/makeqstrdata.py || echo ">> 未找到 too large"

      # ===== 编译 =====
      - name: Install ESP-IDF
        run: |
          cd circuitpython/ports/espressif
          ./esp-idf/install.sh esp32s3

      - name: Install Python requirements
        run: |
          source circuitpython/ports/espressif/esp-idf/export.sh
          pip install -r circuitpython/requirements-dev.txt

      - name: Build mpy-cross
        run: make -C circuitpython/mpy-cross -j"$(nproc)"

      - name: Build firmware
        run: |
          set -o pipefail
          source circuitpython/ports/espressif/esp-idf/export.sh
          make -C circuitpython/ports/espressif BOARD="$BOARD" \
            USER_C_MODULES="$GITHUB_WORKSPACE/omnipython-lvgl/ports/circuitpython" \
            CIRCUITPY_GIFIO=0 \
            V=1 -j"$(nproc)" 2>&1 | tee build.log

      - name: "Diag 4: qstr offset in build output"
        if: always()
        continue-on-error: true
        run: |
          echo "== build.log 中的 QSTR_OFFSET =="
          grep -o "MICROPY_QSTR_OFFSET_BYTES[=0-9]*" build.log | sort | uniq -c || echo ">> 编译命令中未出现"
          echo "== 错误附近 =="
          grep -n -B5 -A5 "too large" build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.BOARD }}
          path: |
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.bin
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.uf2
          if-no-files-found: warn
