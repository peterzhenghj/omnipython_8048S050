name: Build CircuitPython + LVGL

on:
  workflow_dispatch:
    inputs:
      cp_ref:
        description: "CircuitPython tag 或分支（需支持 MICROPY_QSTR_OFFSET_BYTES）"
        required: true
        default: "main"
      board:
        description: "CircuitPython 板子名称"
        required: true
        default: "sunton_esp32_8048S050"
      extra_make_args:
        description: "额外 make 参数，例如 CIRCUITPY_BLEIO=0（方案 B 用，默认留空）"
        required: false
        default: ""
      diag_only:
        description: "只运行检查，不编译"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]

env:
  CP_REF: ${{ github.event.inputs.cp_ref || 'main' }}
  BOARD: ${{ github.event.inputs.board || 'sunton_esp32_8048S050' }}
  EXTRA_MAKE_ARGS: ${{ github.event.inputs.extra_make_args || '' }}
  DIAG_ONLY: ${{ github.event.inputs.diag_only || 'false' }}
  IDF_TOOLS_PATH: ${{ github.workspace }}/.idf_tools

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext cmake ninja-build ccache libusb-1.0-0

      - name: Clone CircuitPython
        run: |
          echo "Cloning CircuitPython ref: $CP_REF"
          git clone --depth 1 --branch "$CP_REF" https://github.com/adafruit/circuitpython.git circuitpython
          git -C circuitpython log -1 --format='%h %cd %s' --date=short

      - name: Clone omnipython-lvgl
        run: |
          git clone --recurse-submodules --shallow-submodules \
            https://github.com/PyDevices/omnipython-lvgl.git omnipython-lvgl
          git -C omnipython-lvgl log -1 --oneline

      # ===== 第 3 步关键检查：CircuitPython 是否支持 4 字节 qstr 偏移 =====
      - name: "Gate: MICROPY_QSTR_OFFSET_BYTES support"
        run: |
          {
            echo "CP_REF=$CP_REF"
            git -C circuitpython log -1 --format='%h %cd %s' --date=short
            echo "== py/ 中的 QSTR_OFFSET =="
            grep -rn "QSTR_OFFSET" circuitpython/py || true
            echo "== makeqstrdata.py 上限定义 =="
            grep -n -E "QSTR_BLOB_MAX|OFFSET_BYTES" circuitpython/py/makeqstrdata.py || true
          } | tee gate.log
          if ! grep -rq "MICROPY_QSTR_OFFSET_BYTES" circuitpython/py; then
            echo "::error::CircuitPython '$CP_REF' 不支持 MICROPY_QSTR_OFFSET_BYTES，qstr 池仍为 64KB 上限，编译必然失败。请换版本或使用方案 B。"
            exit 1
          fi
          echo "OK: '$CP_REF' 支持 MICROPY_QSTR_OFFSET_BYTES"

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: gate.log
          if-no-files-found: ignore

      # ===== 编译 =====
      - name: Fetch port submodules
        if: env.DIAG_ONLY != 'true'
        run: |
          cd circuitpython/ports/espressif
          make fetch-port-submodules

      - name: Install ESP-IDF
        if: env.DIAG_ONLY != 'true'
        run: |
          cd circuitpython/ports/espressif
          ./esp-idf/install.sh esp32s3

      - name: Install Python requirements
        if: env.DIAG_ONLY != 'true'
        run: |
          source circuitpython/ports/espressif/esp-idf/export.sh
          pip install -r circuitpython/requirements-dev.txt

      - name: Build mpy-cross
        if: env.DIAG_ONLY != 'true'
        run: make -C circuitpython/mpy-cross -j"$(nproc)"

      - name: Build firmware
        if: env.DIAG_ONLY != 'true'
        run: |
          set -o pipefail
          source circuitpython/ports/espressif/esp-idf/export.sh
          make -C circuitpython/ports/espressif BOARD="$BOARD" \
            USER_C_MODULES="$GITHUB_WORKSPACE/omnipython-lvgl/ports/circuitpython" \
            CIRCUITPY_GIFIO=0 \
            $EXTRA_MAKE_ARGS \
            V=1 -j"$(nproc)" 2>&1 | tee build.log

      - name: "Diag: qstr / size summary"
        if: always() && env.DIAG_ONLY != 'true'
        continue-on-error: true
        run: |
          echo "== qstr 相关错误 ==" 
          grep -n -B3 -A8 -E "too large|AssertionError" build.log || echo "无 qstr 错误"
          echo "== 编译命令中的 OFFSET_BYTES =="
          grep -o "MICROPY_QSTR_OFFSET_BYTES=[0-9]*" build.log | sort | uniq -c || true
          echo "== 固件大小 / 分区检查 =="
          grep -n -iE "firmware.bin|overflow|too small|partition" build.log | tail -20 || true

      - name: Upload build log
        if: always() && env.DIAG_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload firmware
        if: success() && env.DIAG_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.BOARD }}
          path: |
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.bin
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.uf2
          if-no-files-found: warn
