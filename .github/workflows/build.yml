name: Build CircuitPython + LVGL (Sunton 8048S050)

on:
  workflow_dispatch:
    inputs:
      cp_ref:
        description: "CircuitPython tag/branch"
        default: "11.0.0-alpha.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BOARD: sunton_esp32_8048S050
    defaults:
      run:
        shell: bash          # 显式指定后默认带 -eo pipefail

    steps:
      - name: Checkout CircuitPython
        uses: actions/checkout@v4
        with:
          repository: adafruit/circuitpython
          ref: ${{ inputs.cp_ref }}
          path: circuitpython
          fetch-depth: 0

      - name: Checkout omnipython-lvgl
        uses: actions/checkout@v4
        with:
          repository: PyDevices/omnipython-lvgl
          path: omnipython-lvgl
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext cmake ninja-build ccache libusb-1.0-0

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ inputs.cp_ref }}

      - name: Fetch espressif submodules
        run: |
          for i in 1 2 3; do
            make -C circuitpython/ports/espressif fetch-port-submodules && break
            echo "retry $i"; sleep 10
          done

      - name: Install ESP-IDF + Python deps
        run: |
          cd circuitpython
          pip install -r requirements-dev.txt
          ./ports/espressif/esp-idf/install.sh esp32s3

      - name: Build
        run: |
          cd circuitpython
          source ports/espressif/esp-idf/export.sh
          pip install -r requirements-dev.txt
          make -C ports/espressif -j$(nproc) \
            BOARD=$BOARD \
            CIRCUITPY_GIFIO=0 \
            USER_C_MODULES=$GITHUB_WORKSPACE/omnipython-lvgl/ports/circuitpython \
            2>&1 | tee $GITHUB_WORKSPACE/build.log

      - name: Show errors
        if: failure()
        run: |
          grep -nE "error:|Error [0-9]|overflow|too small|No such file|undefined reference|multiple definition" \
            build.log | head -50 || true

      - name: Rebuild single-thread to show error
        if: failure()
        run: |
          cd circuitpython
          source ports/espressif/esp-idf/export.sh
          make -C ports/espressif -j1 \
            BOARD=$BOARD \
            CIRCUITPY_GIFIO=0 \
            USER_C_MODULES=$GITHUB_WORKSPACE/omnipython-lvgl/ports/circuitpython \
            2>&1 | tail -80

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: circuitpython-lvgl-${{ env.BOARD }}
          path: circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.*
