name: Build CircuitPython + LVGL

on:
  workflow_dispatch:
    inputs:
      cp_ref:
        description: "CircuitPython tag 或分支"
        required: true
        default: "11.0.0-alpha.2"
      board:
        description: "CircuitPython 板子名称"
        required: true
        default: "sunton_esp32_8048S050"
      diag_only:
        description: "只运行排查步骤，不编译"
        type: boolean
        required: true
        default: true
  push:
    branches: [main]

env:
  CP_REF: ${{ github.event.inputs.cp_ref || '11.0.0-alpha.2' }}
  BOARD: ${{ github.event.inputs.board || 'sunton_esp32_8048S050' }}
  DIAG_ONLY: ${{ github.event.inputs.diag_only || 'false' }}
  IDF_TOOLS_PATH: ${{ github.workspace }}/.idf_tools

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext cmake ninja-build ccache libusb-1.0-0

      - name: Clone CircuitPython
        run: |
          echo "Cloning CircuitPython ref: $CP_REF"
          git clone --depth 1 --branch "$CP_REF" https://github.com/adafruit/circuitpython.git circuitpython
          cd circuitpython/ports/espressif
          make fetch-port-submodules

      - name: Clone omnipython-lvgl
        run: |
          git clone --recurse-submodules --shallow-submodules \
            https://github.com/PyDevices/omnipython-lvgl.git omnipython-lvgl

      # ===== 第 2 步：排查信息全部写入 diag.log =====
      - name: Collect diagnostics
        continue-on-error: true
        run: |
          D=diag.log
          {
            echo "########## 1. 版本 ##########"
            echo "CP_REF=$CP_REF  BOARD=$BOARD"
            git -C circuitpython log -1 --oneline
            git -C omnipython-lvgl log -1 --oneline

            echo; echo "########## 2. makeqstrdata.py 报错附近（440-522 行）##########"
            sed -n '440,522p' circuitpython/py/makeqstrdata.py

            echo; echo "########## 3. makeqstrdata.py 中 pool / limit / offset 相关 ##########"
            grep -n -iE "pool|too large|offset|65535|0xffff|1 *<< *16|limit" circuitpython/py/makeqstrdata.py

            echo; echo "########## 4. py/ 中 QSTR_OFFSET / QSTR_BYTES 相关定义 ##########"
            grep -rn -E "QSTR_OFFSET|QSTR_BYTES_IN|QSTR_POOL" circuitpython/py --include=*.h --include=*.c --include=*.mk --include=*.py | head -60

            echo; echo "########## 5. py.mk 中调用 makeqstrdata 的规则 ##########"
            grep -n -B2 -A6 "makeqstrdata" circuitpython/py/py.mk

            echo; echo "########## 6. espressif port 中相关设置 ##########"
            grep -rn -E "QSTR_OFFSET|QSTR_BYTES" circuitpython/ports/espressif --include=*.h --include=*.mk --include=Makefile | grep -v "/esp-idf/" || echo ">> 未找到"

            echo; echo "########## 7. omnipython-lvgl micropython.mk 全文 ##########"
            cat -n omnipython-lvgl/ports/circuitpython/micropython.mk

            echo; echo "########## 8. 板子目录文件 ##########"
            ls -la "circuitpython/ports/espressif/boards/$BOARD" || echo ">> 板子目录不存在"
            cat "circuitpython/ports/espressif/boards/$BOARD/mpconfigboard.mk" 2>/dev/null
          } > "$D" 2>&1
          cat "$D"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-log
          path: diag.log
          if-no-files-found: ignore

      # ===== 编译（diag_only=true 时跳过）=====
      - name: Install ESP-IDF
        if: env.DIAG_ONLY != 'true'
        run: |
          cd circuitpython/ports/espressif
          ./esp-idf/install.sh esp32s3

      - name: Install Python requirements
        if: env.DIAG_ONLY != 'true'
        run: |
          source circuitpython/ports/espressif/esp-idf/export.sh
          pip install -r circuitpython/requirements-dev.txt

      - name: Build mpy-cross
        if: env.DIAG_ONLY != 'true'
        run: make -C circuitpython/mpy-cross -j"$(nproc)"

      - name: Build firmware
        if: env.DIAG_ONLY != 'true'
        run: |
          set -o pipefail
          source circuitpython/ports/espressif/esp-idf/export.sh
          make -C circuitpython/ports/espressif BOARD="$BOARD" \
            USER_C_MODULES="$GITHUB_WORKSPACE/omnipython-lvgl/ports/circuitpython" \
            CIRCUITPY_GIFIO=0 \
            V=1 -j"$(nproc)" 2>&1 | tee build.log

      - name: Upload build log
        if: always() && env.DIAG_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload firmware
        if: success() && env.DIAG_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.BOARD }}
          path: |
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.bin
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.uf2
          if-no-files-found: warn
