name: Build CircuitPython + LVGL (Sunton 8048S050)

on:
  workflow_dispatch:
    inputs:
      cp_ref:
        description: "CircuitPython tag/branch"
        default: "main"
      lvgl_ref:
        description: "omnipython-lvgl branch/tag/commit"
        default: "main"
      jobs:
        description: "make -j (排查时设为 1)"
        default: "4"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BOARD: sunton_esp32_8048S050
      LVGL_MOD: ${{ github.workspace }}/omnipython-lvgl/ports/circuitpython
    defaults:
      run:
        shell: bash   # -eo pipefail

    steps:
      - name: Checkout CircuitPython
        uses: actions/checkout@v4
        with:
          repository: adafruit/circuitpython
          ref: ${{ inputs.cp_ref }}
          path: circuitpython
          fetch-depth: 0

      - name: Checkout omnipython-lvgl
        uses: actions/checkout@v4
        with:
          repository: PyDevices/omnipython-lvgl
          ref: ${{ inputs.lvgl_ref }}
          path: omnipython-lvgl
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext cmake ninja-build ccache libusb-1.0-0

      - name: Show versions
        run: |
          echo "CircuitPython: $(git -C circuitpython describe --tags --always)"
          echo "omnipython-lvgl: $(git -C omnipython-lvgl rev-parse --short HEAD)"

      - name: Show omnipython-lvgl CI hints
        run: |
          ls -la omnipython-lvgl/.github/workflows/ 2>/dev/null || echo "(no workflows)"
          grep -rnE "adafruit/circuitpython|ref:|\.patch|git apply|makeqstrdata" \
            omnipython-lvgl/.github/workflows/ omnipython-lvgl/ports/circuitpython/ 2>/dev/null \
            | head -40 || true

      - name: Apply omnipython-lvgl patches (if any)
        run: |
          cd circuitpython
          shopt -s nullglob
          patches=()
          for d in "$GITHUB_WORKSPACE/omnipython-lvgl/ports/circuitpython" \
                   "$GITHUB_WORKSPACE/omnipython-lvgl/ports/circuitpython/patches" \
                   "$GITHUB_WORKSPACE/omnipython-lvgl/patches"; do
            patches+=("$d"/*.patch "$d"/*.diff)
          done
          [ ${#patches[@]} -eq 0 ] && { echo "No patches found, skip."; exit 0; }
          for p in "${patches[@]}"; do
            echo ">> applying $p"
            git apply --check "$p" && git apply "$p"
          done

      - name: Dump makeqstrdata pool logic
        run: |
          cd circuitpython
          git log --oneline -3 -- py/makeqstrdata.py
          echo "----- makeqstrdata.py 440-505 -----"
          sed -n '440,505p' py/makeqstrdata.py
          echo "----- qstr.h / qstr.c -----"
          grep -rnE "QSTR_POOL|qstr_pool|MICROPY_QSTR_BYTES|total_qstr" py/qstr.h py/qstr.c | head -20 || true

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ runner.os }}-${{ inputs.cp_ref }}

      - name: Fetch espressif submodules
        run: |
          for i in 1 2 3; do
            make -C circuitpython/ports/espressif fetch-port-submodules && break
            echo "retry $i"; sleep 10
          done

      - name: Install ESP-IDF + Python deps
        run: |
          cd circuitpython
          pip install -r requirements-dev.txt
          ./ports/espressif/esp-idf/install.sh esp32s3

      - name: Build
        run: |
          cd circuitpython
          source ports/espressif/esp-idf/export.sh
          pip install -r requirements-dev.txt
          make -C ports/espressif -j${{ inputs.jobs }} \
            BOARD=$BOARD \
            CIRCUITPY_GIFIO=0 \
            USER_C_MODULES=$LVGL_MOD \
            2>&1 | tee $GITHUB_WORKSPACE/build.log

      - name: Show errors
        if: failure()
        run: |
          grep -nE "error:|Error [0-9]|AssertionError|too large|overflow|too small|No such file|undefined reference|multiple definition" \
            build.log | head -60 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: circuitpython-lvgl-${{ env.BOARD }}
          path: |
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.bin
            circuitpython/ports/espressif/build-${{ env.BOARD }}/firmware.uf2
          if-no-files-found: warn
